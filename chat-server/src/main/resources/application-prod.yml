# Production / Cloud Configuration
azure:
  cosmos:
    endpoint: ${COSMOS_ENDPOINT}
    key: ${COSMOS_KEY}
    database: ${COSMOS_DATABASE:ChatDB}

container:
  app:
    replica:
      name: ${CONTAINER_APP_REPLICA_NAME}

chat:
  grpc:
    port: ${PORT:50051}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
