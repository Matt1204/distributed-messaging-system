syntax = "proto3";

package com.coen6731.chat;

option java_multiple_files = true;
option java_package = "com.coen6731.chat";
option java_outer_classname = "ChatProto";

service MessagingService {
  // Bidirectional streaming chat RPC. Input is client events and output is server events.
  rpc Chat(stream ClientEvent) returns (stream ServerEvent);
}

// client -> server
message ClientEvent {
  oneof payload {
    LoginUser loginUser = 1;
    RegisterUser registerUser = 2;
    OutboundMessage outboundMessage = 3;
    HeartbeatPing heartbeatPing = 4;
    Catchup catchup = 5;
  }
}

// server -> client
message ServerEvent {
  oneof payload {
    InboundMessage inboundMessage = 1;
    ServerError serverError = 2;
    CatchupComplete catchupComplete = 3;
    HeartbeatPong heartbeatPong = 4;
    AuthSuccess authSuccess = 5;
    SendMessageAck sendMessageAck = 6;
  }
}

// ------------------------------------------------------------------------------------------------
// client messages

// Login request.
message LoginUser {
  string email = 1;
  string password = 2;
}

// Register request.
message RegisterUser {
  string email = 1;
  string password = 2;
}

// Outbound chat message from sender to recipient.
message OutboundMessage {
  string toEmail = 1;
  string text = 2;
  string clientMsgId = 3;
  string conversationId = 4;
}

// Heartbeat request used to keep stream healthy.
message HeartbeatPing {
  int64 ts = 1;
}

message Catchup {
  string userId = 1;
  int64 lastSyncSequenceId = 2;
}

// ------------------------------------------------------------------------------------------------
// server messages

// Canonical message payload delivered to recipients.
message InboundMessage {
  string serverMsgId = 1;
  string clientMsgId = 2;
  string conversationId = 3;
  string fromUserId = 4;
  string fromEmail = 5;
  string toUserId = 6;
  string text = 7;
  int64 sentAtMs = 8;
}

// Outbound send status reported back to sender.
message SendMessageAck {
  string clientMsgId = 1;
  string serverMsgId = 2;
  string conversationId = 3;
  SendStatus status = 4;
  string errorCode = 5;
  string errorReason = 6;
  int64 ackTs = 7;
}

// Message persistence/delivery state for sender reconciliation.
enum SendStatus {
  SEND_STATUS_UNSPECIFIED = 0;
  PERSISTED_PENDING_DELIVERY = 1;
  FAILED = 2;
  DELIVERED_LIVE = 3;
}

message ServerError {
  string code = 1;
  string reason = 2;
}

message CatchupComplete {
  string userId = 1;
  int64 truthSequenceId = 2;
}

message HeartbeatPong {
  int64 ts = 1;
}

message AuthSuccess {
  string userId = 1;
  string email = 2;
}
